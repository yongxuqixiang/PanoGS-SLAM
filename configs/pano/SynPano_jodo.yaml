# PanoGS-SLAM – SynPano jodo (room5) config
#
# Usage:
#   python slam.py --config configs/pano/SynPano_jodo.yaml --eval

inherit_from: "configs/pano/base_config.yaml"

Dataset:
  dataset_path: "datasets/SynPano/jodo"
  dataset_path_image: "datasets/SynPano/jodo/images_small"
  mask_path:

  fovx: 360
  fovy: 180
  width: 960
  height: 480

  opacity_region_boost: 1.0
  pcd_downsample: 8
  pcd_downsample_init: 8

Training:
  tracking_itr_num: 150
  mapping_itr_num: 150
  gaussian_update_every: 40
  gaussian_update_offset: 20

  # Larger scene: tighter keyframe spacing to reduce drift
  kf_translation: 0.05
  kf_min_translation: 0.03
